<svg width="1442" height="793" viewBox="0 0 1442 793" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="maskGrad" cx="50%" cy="50%" r="60%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="70%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="fadeMask">
      <rect width="1442" height="793" fill="url(#maskGrad)"/>
    </mask>

    <linearGradient id="dotGrad" x1="0" y1="0" x2="0" y2="793" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#124559"/>
      <stop offset="100%" stop-color="#124559" stop-opacity="0.25"/>
    </linearGradient>

    <pattern id="dotPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="url(#dotGrad)"/>
    </pattern>

    <pattern id="dotPatternLarge" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="60" cy="60" r="3" fill="#124559" fill-opacity="0.35"/>
    </pattern>

    <pattern id="crossPattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect x="54" y="59.25" width="12" height="1.5" fill="#124559" fill-opacity="0.2"/>
      <rect x="59.25" y="54" width="1.5" height="12" fill="#124559" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1442" height="793" fill="url(#dotPattern)" mask="url(#fadeMask)" opacity="0.8"/>
  <rect width="1442" height="793" fill="url(#dotPatternLarge)" mask="url(#fadeMask)" opacity="0.6"/>
  <rect width="1442" height="793" fill="url(#crossPattern)" mask="url(#fadeMask)" opacity="0.9"/>
</svg>
